services:
  postgres:
    image: postgres:16-alpine
    container_name: user-ms-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: user_ms
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr -d user_ms"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-catalog:
    image: postgres:16-alpine
    container_name: catalog-ms-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: catalog_ms
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr -d catalog_ms"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    container_name: restaurant-ms-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: restaurant_ms
      MYSQL_USER: usr
      MYSQL_PASSWORD: pwd
      MYSQL_ROOT_PASSWORD: pwd
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uusr -ppwd --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    build: ./rabbitmq
    image: local-infra-rabbitmq:local
    container_name: user-ms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: usr
      RABBITMQ_DEFAULT_PASS: pwd
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q ping && rabbitmqctl list_queues name | grep -q restaurant-ms-user-created-queue && rabbitmqctl list_queues name | grep -q restaurant-ms-user-deleted-queue && rabbitmqctl list_queues name | grep -q restaurant-ms-user-created-dlq && rabbitmqctl list_queues name | grep -q restaurant-ms-user-deleted-dlq && rabbitmqctl list_queues name | grep -q restaurant-created && rabbitmqctl list_queues name | grep -q restaurant-deleted && rabbitmqctl list_exchanges name | grep -q user.created && rabbitmqctl list_exchanges name | grep -q user.deleted"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 50s

  user-ms:
    build:
      context: ../user-ms/user-ms
      dockerfile: Dockerfile
    image: local-infra-user-ms:local
    container_name: user-ms-app
    ports:
      - "8001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_ms
      SPRING_DATASOURCE_USERNAME: usr
      SPRING_DATASOURCE_PASSWORD: pwd
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: usr
      SPRING_RABBITMQ_PASSWORD: pwd
      GEOAPIFY_API_KEY: d1f434e8f38e4092af7f87a16b65754d
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  restaurant-ms:
    build:
      context: ../restaurant-ms/restaurant-ms
      dockerfile: Dockerfile
    image: local-infra-restaurant-ms:local
    container_name: restaurant-ms-app
    ports:
      - "8002:8002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/restaurant_ms
      SPRING_DATASOURCE_USERNAME: usr
      SPRING_DATASOURCE_PASSWORD: pwd
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: usr
      SPRING_RABBITMQ_PASSWORD: pwd
      GEOAPIFY_API_KEY: d1f434e8f38e4092af7f87a16b65754d
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-ms:
    build:
      context: ../catalog-ms/catalog-ms
      dockerfile: Dockerfile
    image: local-infra-catalog-ms:local
    container_name: catalog-ms-app
    ports:
      - "8003:8003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-catalog:5432/catalog_ms
      SPRING_DATASOURCE_USERNAME: usr
      SPRING_DATASOURCE_PASSWORD: pwd
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: usr
      SPRING_RABBITMQ_PASSWORD: pwd
    depends_on:
      postgres-catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: food-delivery-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-ms
      - restaurant-ms
      - catalog-ms
